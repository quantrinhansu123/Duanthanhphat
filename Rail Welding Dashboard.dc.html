<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tổng quan · Rail Welding Management</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  html,body{margin:0;padding:0;background:#f5f7fa;height:100%;}
  *{box-sizing:border-box;}
  a{color:#1a73e8;text-decoration:none;}
  a:hover{color:#1257b8;}
  body{
    font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    color:#1f2937;font-size:14px;-webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh;background:#f5f7fa;}
  .sidebar{width:250px;flex:0 0 250px;background:#0d1b2e;display:flex;flex-direction:column;padding-bottom:18px;}
  .nav{display:flex;flex-direction:column;gap:4px;padding:0 12px;}
  .nav a,.nav .item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:9px;color:#c6d1e0;font-size:14.5px;}
  .nav a:hover{background:#16273d;color:#fff;}
  .nav .active{background:#1565d8;color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(21,101,216,0.45);}
  .nav i{font-size:19px;}
  .main{flex:1 1 auto;padding:14px 23px 12px 24px;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;}
  .filters{display:flex;align-items:center;gap:16px;}
  .filter{background:#fff;border:1px solid #e4e8ee;border-radius:9px;padding:7px 13px 9px;}
  .filter .lbl{font-size:10.5px;color:#8b95a5;letter-spacing:0.2px;margin-bottom:3px;}
  .filter .row{display:flex;align-items:center;gap:9px;}
  .filter .val{flex:1 1 auto;font-size:14.5px;color:#243447;white-space:nowrap;}
  .btn-filter{display:flex;align-items:center;gap:8px;background:#1a73e8;color:#fff;border-radius:8px;padding:10px 22px;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(26,115,232,0.35);border:0;}
  .btn-filter:hover{background:#1257b8;}
  .tabs{
    display:flex;gap:6px;background:#fff;border:1px solid #e8ebf0;border-radius:12px;padding:6px;
    box-shadow:0 1px 2px rgba(16,24,40,0.04);
  }
  .tab{
    flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 12px;border:0;border-radius:9px;background:transparent;
    color:#5d6b7d;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
    white-space:nowrap;
  }
  .tab i{font-size:18px;}
  .tab:hover{background:#f3f6fb;color:#16233a;}
  .tab.active{background:#1565d8;color:#fff;box-shadow:0 2px 8px rgba(21,101,216,0.35);}
  .view-wrap{flex:1 1 auto;min-height:0;background:#f5f7fa;border:1px solid #e8ebf0;border-radius:12px;overflow:hidden;}
  #report-frame{display:block;width:100%;height:100%;min-height:calc(100vh - 210px);border:0;background:#f5f7fa;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div style="display:flex;align-items:center;gap:12px;padding:22px 18px 26px 20px;">
      <img src="logo.png" alt="Thành Phát" style="width:46px;height:46px;flex:0 0 46px;display:block;border-radius:50%;object-fit:cover;background:#ffffff;">
      <div style="line-height:1.15;color:#ffffff;font-size:16px;font-weight:800;letter-spacing:0.6px;white-space:nowrap;">THÀNH PHÁT</div>
    </div>
    <nav class="nav">
      <a href="index.html"><i class="ph ph-house"></i><span>Trang chủ</span></a>
      <div class="item active"><i class="ph-fill ph-squares-four"></i><span>Tổng quan</span></div>
      <a href="Bao cao Chat luong.dc.html"><i class="ph ph-check-circle"></i><span>Chất lượng</span></a>
      <a href="Bao cao May moc.dc.html"><i class="ph ph-gear-six"></i><span>Máy móc</span></a>
      <a href="Bao cao Nhan su.dc.html"><i class="ph ph-users"></i><span>Nhân sự</span></a>
    </nav>
    <div style="flex:1 1 auto;"></div>
    <div style="margin:0 12px 12px;padding:12px 14px;border-radius:12px;background:#16273d;display:flex;align-items:center;gap:12px;">
      <div style="width:42px;height:42px;border-radius:50%;overflow:hidden;flex:0 0 42px;background:#41576f;display:flex;align-items:flex-end;justify-content:center;"><i class="ph-fill ph-user" style="font-size:34px;color:#c9d4e2;"></i></div>
      <div style="flex:1;line-height:1.35;">
        <div style="color:#fff;font-size:14.5px;font-weight:600;">Nguyễn Văn A</div>
        <div style="color:#93a3b8;font-size:12.5px;">Quản trị viên</div>
      </div>
    </div>
    <div style="margin:0 12px;padding:14px;border-radius:12px;background:#16273d;display:flex;align-items:center;gap:12px;">
      <i class="ph ph-moon" style="font-size:20px;color:#cfd8e3;"></i>
      <div style="flex:1;color:#e6ecf3;font-size:14.5px;font-weight:500;">Chế độ tối</div>
    </div>
  </aside>

  <main class="main">
    <div class="filters">
      <div class="filter" style="width:255px;">
        <div class="lbl">Dự án</div>
        <div class="row"><i class="ph-fill ph-train-simple" style="font-size:17px;color:#1a73e8;"></i><div class="val">ĐSCT Bắc – Nam</div><i class="ph ph-caret-down" style="font-size:14px;color:#8b95a5;"></i></div>
      </div>
      <div class="filter" style="width:205px;">
        <div class="lbl">Nhà máy</div>
        <div class="row"><i class="ph-fill ph-buildings" style="font-size:17px;color:#14b8a6;"></i><div class="val">Tất cả nhà máy</div><i class="ph ph-caret-down" style="font-size:14px;color:#8b95a5;"></i></div>
      </div>
      <div class="filter" style="width:262px;">
        <div class="lbl">Khoảng thời gian</div>
        <div class="row"><i class="ph-fill ph-calendar-blank" style="font-size:17px;color:#a855f7;"></i><div class="val">01/05/2024 – 31/05/2024</div><i class="ph ph-caret-down" style="font-size:14px;color:#8b95a5;"></i></div>
      </div>
      <button class="btn-filter" type="button"><i class="ph-fill ph-funnel" style="font-size:16px;"></i><span>Bộ lọc</span></button>
      <div style="flex:1 1 auto;"></div>
      <div style="position:relative;padding-right:4px;">
        <i class="ph ph-bell" style="font-size:24px;color:#5d6b7d;"></i>
        <div style="position:absolute;top:-9px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #f5f7fa;">3</div>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" type="button" role="tab" data-tab="tong-quan" aria-selected="true">
        <i class="ph-fill ph-squares-four"></i><span>Tổng quan</span>
      </button>
      <button class="tab" type="button" role="tab" data-tab="chat-luong" aria-selected="false">
        <i class="ph-fill ph-shield-check"></i><span>Báo cáo Chất lượng</span>
      </button>
      <button class="tab" type="button" role="tab" data-tab="may-moc" aria-selected="false">
        <i class="ph-fill ph-gear-six"></i><span>Báo cáo Máy móc</span>
      </button>
      <button class="tab" type="button" role="tab" data-tab="nhan-su" aria-selected="false">
        <i class="ph-fill ph-users-three"></i><span>Báo cáo Nhân sự</span>
      </button>
    </div>

    <div class="view-wrap">
      <iframe id="report-frame" title="Nội dung báo cáo" src="tong-quan.dc.html"></iframe>
    </div>
  </main>
</div>
<script>
(function () {
  var views = {
    "tong-quan": "tong-quan.dc.html",
    "chat-luong": "Bao cao Chat luong.dc.html",
    "may-moc": "Bao cao May moc.dc.html",
    "nhan-su": "Bao cao Nhan su.dc.html"
  };
  var frame = document.getElementById("report-frame");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

  function fitFrame() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.body) return;
      var h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 900);
      frame.style.minHeight = h + "px";
    } catch (e) {}
  }

  function openTab(id) {
    if (!views[id]) id = "tong-quan";
    tabs.forEach(function (tab) {
      var on = tab.getAttribute("data-tab") === id;
      tab.classList.toggle("active", on);
      tab.setAttribute("aria-selected", on ? "true" : "false");
    });
    var src = views[id];
    if (frame.getAttribute("src") !== src) frame.setAttribute("src", src);
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  }

  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      openTab(tab.getAttribute("data-tab"));
    });
  });
  frame.addEventListener("load", fitFrame);
  window.addEventListener("resize", fitFrame);
  openTab((location.hash || "#tong-quan").slice(1));
})();
</script>
</body>
</html>
