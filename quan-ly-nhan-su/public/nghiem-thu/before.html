<!doctype html><html lang="vi"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;width:1000px;height:330px;background:#f1f5f9;font-family:Inter,Segoe UI,sans-serif;padding:16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.c b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#64748b}.c i{display:block;margin-top:8px;font:700 28px Consolas,monospace;font-style:normal}.al{background:#fff;border:1px solid #fda4af;border-left:4px solid #e11d48;padding:14px;margin-bottom:14px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;padding-bottom:10px}.ic{display:inline-block;width:24px;height:24px;background:#e11d48;color:#fff;text-align:center;font-weight:700;margin-right:10px;vertical-align:top}h2{display:inline-block;margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#9f1239}p{margin:2px 0 0 34px;font:11px Consolas,monospace;color:#475569}.btn{background:#e11d48;border:1px solid #be123c;color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;padding:10px 14px}.chips{margin-top:10px;display:flex;gap:8px}.chip{border:1px solid #fecdd3;border-left:2px solid #e11d48;background:#f8fafc;padding:6px 10px;font:600 12px Consolas,monospace;color:#9f1239;white-space:nowrap}.chip s{text-decoration:none;background:#e11d48;color:#fff;font-size:10px;padding:2px 6px;margin-right:6px}.chip u{text-decoration:none;color:#0047AB;margin-right:8px}</style><body><div class="cards"><div class="c"><b>Tổng số bộ thiết bị</b><i>12</i></div><div class="c"><b style="color:#0047AB">Đang hoạt động</b><i style="color:#0047AB">9</i></div><div class="c"><b style="color:#b45309">Đang bảo trì</b><i>2</i></div><div class="c"><b>Ngừng</b><i>1</i></div></div></body></html>
